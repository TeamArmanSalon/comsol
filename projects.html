<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Follow ongoing and completed community projects in your barangay." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
<title>Community Projects — ComSol</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-root">
  <div class="section-block-head">
    <h3>Community Projects</h3>
  </div>
  <p style="color:var(--text-muted);font-size:14px;margin:-4px 0 16px">Track ongoing and completed community improvement projects in your barangay.</p>

  <div class="tabs" id="tabs">
    <button class="tab active" data-f="all">All</button>
    <button class="tab" data-f="ongoing">Ongoing</button>
    <button class="tab" data-f="completed">Completed</button>
  </div>

  <div class="list-stack" id="list"></div>
</div>

<div class="modal-scrim" id="detailModal">
  <div class="modal modal-detail" id="detailBody"></div>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
  ComSol.requireAuth();
  let filter = 'all';

  function render() {
    const all = ComSol.getProjects();
    const items = filter === 'all' ? all : all.filter(p => p.status === filter);
    document.getElementById('list').innerHTML = items.map(p => `
      <div class="list-card">
        <div class="lc-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></div>
        <div class="lc-body">
          <span class="tag ${p.status}">${p.status === 'ongoing' ? 'Ongoing' : 'Completed'}</span>
          <div class="lc-title">${p.title}</div>
          <div class="lc-text">${p.body}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${p.progress}%"></div></div>
          <div class="lc-meta">
            <span><strong>Location:</strong> ${p.location}</span>
            <span><strong>Progress:</strong> ${p.progress}%</span>
            <span><strong>Started:</strong> ${ComSol.formatDate(p.started)}</span>
          </div>
        </div>
        <div class="lc-actions">
          <button class="btn btn-ghost" data-id="${p.id}">Details</button>
        </div>
      </div>
    `).join('');
  }

  // The shell replaces <body>, so build it FIRST and bind listeners after —
  // otherwise every listener below is attached to elements that get discarded.
  renderShell({ active: 'projects', title: 'Community Projects' });

  document.getElementById('tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if (!b) return;
    document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.f;
    render();
  });

  document.getElementById('list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-id]'); if (!b) return;
    const p = ComSol.getProjects().find(x => String(x.id) === b.dataset.id);
    if (!p) return;
    document.getElementById('detailBody').innerHTML = `
      <h3 style="text-align:left;margin-bottom:8px">${p.title}</h3>
      <p style="text-align:left;margin-bottom:14px"><span class="tag ${p.status}">${p.status === 'ongoing' ? 'Ongoing' : 'Completed'}</span></p>
      <p style="text-align:left;color:var(--text);margin-bottom:16px">${p.body}</p>
      <dl>
        <dt>Location</dt><dd>${p.location}</dd>
        <dt>Progress</dt><dd>${p.progress}%</dd>
        <dt>Started</dt><dd>${new Date(p.started).toLocaleDateString()}</dd>
      </dl>
      <div class="progress-track" style="margin-bottom:20px"><div class="progress-fill" style="width:${p.progress}%"></div></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="document.getElementById('detailModal').classList.remove('open')">Close</button>
      </div>
    `;
    document.getElementById('detailModal').classList.add('open');
  });
  document.getElementById('detailModal').addEventListener('click', (e) => {
    if (e.target.id === 'detailModal') e.currentTarget.classList.remove('open');
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.getElementById('detailModal').classList.remove('open');
  });

  render();
</script>
</body>
</html>
