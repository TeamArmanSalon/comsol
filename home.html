<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Your ComSol dashboard: report statistics, announcements and community updates." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
<title>Home — ComSol</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-root">
  <div class="welcome">
    <div>
      <h2 id="w-hello">Welcome back!</h2>
      <p>Stay informed and take action for your community.</p>
    </div>
    <a href="create.html" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Report an Issue
    </a>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>
      <div class="lbl">My Reports</div><div class="val" id="s-total">0</div>
    </div>
    <div class="stat-card pending">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
      <div class="lbl">Pending</div><div class="val" id="s-pending">0</div>
    </div>
    <div class="stat-card review">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg></div>
      <div class="lbl">Review</div><div class="val" id="s-review">0</div>
    </div>
    <div class="stat-card progress">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.8 2.8M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.8-2.8M16.2 7.8l2.9-2.9"/></svg></div>
      <div class="lbl">In Progress</div><div class="val" id="s-progress">0</div>
    </div>
    <div class="stat-card resolved">
      <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
      <div class="lbl">Resolved</div><div class="val" id="s-resolved">0</div>
    </div>
  </div>

  <div class="section-block">
    <div class="section-block-head">
      <h3>Explore Modules</h3>
    </div>
    <div class="module-grid" id="modules"></div>
  </div>

  <div class="section-block">
    <div class="section-block-head">
      <h3>Latest Announcements &amp; Alerts</h3>
      <a href="announcements.html">See all →</a>
    </div>
    <div class="list-stack" id="alerts"></div>
  </div>

  <div class="section-block">
    <div class="section-block-head">
      <h3>Community Projects</h3>
      <a href="projects.html">See all →</a>
    </div>
    <div class="list-stack" id="projects-preview"></div>
  </div>

  <div class="section-block">
    <div class="section-block-head">
      <h3>My Recent Reports</h3>
      <a href="reports.html">See all →</a>
    </div>
    <div class="reports-grid" id="recent"></div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
  ComSol.requireAuth();
  const user = ComSol.getUser();
  document.getElementById('w-hello').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;

  const reports = ComSol.getReports();
  document.getElementById('s-total').textContent = reports.length;
  document.getElementById('s-pending').textContent  = reports.filter(r => r.status === 'pending').length;
  document.getElementById('s-review').textContent   = reports.filter(r => r.status === 'review').length;
  document.getElementById('s-progress').textContent = reports.filter(r => r.status === 'progress').length;
  document.getElementById('s-resolved').textContent = reports.filter(r => r.status === 'resolved').length;

  const modules = [
    { href: 'create.html',        label: 'Report an Issue',    sub: 'Submit a new report',   svg: '<path d="M12 5v14M5 12h14"/>' },
    { href: 'reports.html',       label: 'Track My Reports',   sub: 'View status & updates', svg: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/>' },
    { href: 'projects.html',      label: 'Community Projects', sub: 'Ongoing & completed',   svg: '<path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/>' },
    { href: 'announcements.html', label: 'Announcements',      sub: 'Advisories & notices',  svg: '<path d="M3 11v2a2 2 0 0 0 2 2h2l6 4V5L7 9H5a2 2 0 0 0-2 2z"/><path d="M17 8a5 5 0 0 1 0 8"/>' },
    { href: 'events.html',        label: 'Events',             sub: 'Upcoming schedule',     svg: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/>' },
    { href: 'feedback.html',      label: 'Feedback',           sub: 'Suggestions & complaints', svg: '<path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>' },
    { href: 'officials.html',     label: 'Contact Officials',  sub: 'Barangay directory',    svg: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0 1 22 16.9z"/>' },
    { href: 'emergency.html',     label: 'Emergency',          sub: 'Hotlines & response',   svg: '<path d="M4 20h16M6 20v-5a6 6 0 0 1 12 0v5M12 4v3M4.9 6.9l2 2M19.1 6.9l-2 2"/>' },
  ];
  document.getElementById('modules').innerHTML = modules.map(m => `
    <a class="module-card" href="${m.href}">
      <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${m.svg}</svg></div>
      <div class="lbl">${m.label}</div>
      <div class="sub">${m.sub}</div>
    </a>`).join('');

  document.getElementById('alerts').innerHTML = ComSol.getAnnouncements().slice(0, 3).map(a => `
    <a class="list-card" href="announcements.html">
      <div class="lc-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h2l6 4V5L7 9H5a2 2 0 0 0-2 2z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></div>
      <div class="lc-body">
        <span class="tag ${a.tag.toLowerCase()}">${a.tag}</span>
        <div class="lc-title">${a.title}</div>
        <div class="lc-text">${a.body}</div>
        <div class="lc-meta"><span>Posted ${ComSol.formatDate(a.date)}</span></div>
      </div>
    </a>`).join('');

  document.getElementById('projects-preview').innerHTML = ComSol.getProjects().slice(0, 2).map(p => `
    <a class="list-card" href="projects.html">
      <div class="lc-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V9l7-5 7 5v12M9 21v-6h6v6"/></svg></div>
      <div class="lc-body">
        <span class="tag ${p.status}">${p.status === 'ongoing' ? 'Ongoing' : 'Completed'}</span>
        <div class="lc-title">${p.title}</div>
        <div class="lc-text">${p.body}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${p.progress}%"></div></div>
        <div class="lc-meta"><span><strong>Location:</strong> ${p.location}</span><span><strong>Progress:</strong> ${p.progress}%</span></div>
      </div>
    </a>`).join('');

  const recent = reports.slice(0, 3);
  document.getElementById('recent').innerHTML = recent.length ? recent.map(r => `
    <div class="report-card">
      <div class="report-thumb" ${r.image ? `style="background-image:url('${r.image}')"` : ''}>
        ${!r.image ? ComSol.categoryIcon(ComSol.categoryIconKey(r.category), 32) : ''}
        <span class="badge ${r.status}">${ComSol.statusLabel(r.status)}</span>
      </div>
      <div class="report-body">
        <div class="cat">${r.category}</div>
        <div class="title">${r.title}</div>
        <div class="desc">${r.description || ''}</div>
        <div class="meta">
          <span class="ref-chip">${r.ref || ''}</span>
          <a class="details-link" href="reports.html">View →</a>
        </div>
      </div>
    </div>
  `).join('') : `<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg><p>No reports yet — submit your first one to get started.</p></div>`;

  renderShell({ active: 'dashboard', title: 'Home' });
</script>
</body>
</html>
