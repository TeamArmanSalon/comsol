<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reporting analytics, KPIs and CSV export for the barangay office." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
    <title>Reports Analytics — ComSol Admin</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app-root">
      <div class="section-block-head">
        <h3>Reports Analytics</h3>
        <a href="#" id="exportBtn">Export CSV ↓</a>
      </div>
      <p style="color: var(--text-muted); font-size: 14px; margin: -4px 0 18px">
        Resolution performance and reporting volume across the barangay.
      </p>

      <div class="stats-grid" id="kpis"></div>

      <div class="section-block">
        <div class="section-block-head"><h3>Reports by Status</h3></div>
        <div class="card" id="byStatus"></div>
      </div>

      <div class="section-block">
        <div class="section-block-head"><h3>Reports by Category</h3></div>
        <div class="card" id="byCategory"></div>
      </div>

      <div class="section-block">
        <div class="section-block-head"><h3>Submissions per Month</h3></div>
        <div class="card"><div class="chart-cols" id="byMonth"></div></div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script>
      ComSol.requireAdmin();
      // Build the admin shell first so every listener below binds to live nodes.
      renderAdminShell({ active: "analytics", title: "Reports Analytics" });

      const s = ComSol.reportStats();
      const closed = s.resolved + s.rejected;
      const rate = s.total ? Math.round((s.resolved / s.total) * 100) : 0;

      document.getElementById("kpis").innerHTML = [
        { lbl: "Total Reports", val: s.total, cls: "" },
        { lbl: "Open Cases", val: s.total - closed, cls: "pending" },
        { lbl: "Resolution Rate", val: rate + "%", cls: "resolved" },
        {
          lbl: "Avg. Days to Resolve",
          val: ComSol.avgResolutionDays(),
          cls: "review",
        },
      ]
        .map(
          (c) => `
      <div class="stat-card ${c.cls}">
        <div class="lbl">${c.lbl}</div>
        <div class="val">${c.val}</div>
      </div>`,
        )
        .join("");

      // Horizontal bars — status
      const statuses = [
        "pending",
        "review",
        "progress",
        "resolved",
        "rejected",
      ];
      const maxS = Math.max(...statuses.map((k) => s[k]), 1);
      document.getElementById("byStatus").innerHTML = statuses
        .map(
          (k) => `
      <div class="bar-row">
        <div class="bar-label">${ComSol.statusLabel(k)}</div>
        <div class="bar-track"><div class="bar-fill ${k}" style="width:${(s[k] / maxS) * 100}%"></div></div>
        <div class="bar-val">${s[k]}</div>
      </div>`,
        )
        .join("");

      // Horizontal bars — category
      const bd = ComSol.categoryBreakdown();
      const maxC = Math.max(...bd.map((b) => b.count), 1);
      document.getElementById("byCategory").innerHTML = bd.length
        ? bd
            .map(
              (b) => `
      <div class="bar-row">
        <div class="bar-label">${b.name}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(b.count / maxC) * 100}%"></div></div>
        <div class="bar-val">${b.count}</div>
      </div>`,
            )
            .join("")
        : '<p style="color:var(--text-muted);font-size:14px">No reports yet.</p>';

      // Vertical column chart — last 6 months
      const months = ComSol.reportsByMonth(6);
      const maxM = Math.max(...months.map((m) => m.count), 1);
      document.getElementById("byMonth").innerHTML = months
        .map(
          (m) => `
      <div class="chart-col">
        <div class="cc-val">${m.count}</div>
        <div class="cc-bar" style="height:${Math.max((m.count / maxM) * 100, 4)}%"></div>
        <div class="cc-lbl">${m.label}</div>
      </div>`,
        )
        .join("");

      document.getElementById("exportBtn").addEventListener("click", (e) => {
        e.preventDefault();
        ComSol.exportReportsCSV();
        ComSol.toast("Report data exported as CSV.");
      });

    </script>
  </body>
</html>
