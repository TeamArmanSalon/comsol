<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Publish announcements to all ComSol residents." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
    <title>Post Announcement — ComSol Admin</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app-root">
      <form class="form-card" id="postForm">
        <h2>Post an Announcement</h2>
        <p class="subtitle">
          Published announcements appear instantly on the resident Announcements
          page.
        </p>

        <div class="form-group">
          <label class="form-label">Type</label>
          <select class="form-select form-input" id="tag">
            <option value="Advisory">Advisory</option>
            <option value="Notice">Notice</option>
            <option value="Announcement">Announcement</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Title</label>
          <input
            class="form-input"
            id="title"
            placeholder="e.g. Water interruption on Aug 12"
            required
            maxlength="90"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Details</label>
          <textarea
            class="form-textarea form-input"
            id="body"
            placeholder="Give residents the who, when, and where…"
            required
            maxlength="500"
          ></textarea>
        </div>

        <button class="btn" type="submit">Publish Announcement</button>
      </form>

      <div class="section-block" style="margin-top: 28px">
        <div class="section-block-head"><h3>Published by the Office</h3></div>
        <div class="list-stack" id="posted"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script>
      ComSol.requireAdmin();

      function renderPosted() {
        const list = ComSol.getPosts();
        document.getElementById("posted").innerHTML = list.length
          ? list
              .map(
                (p) => `
      <div class="list-card">
        <div class="lc-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h2l6 4V5L7 9H5a2 2 0 0 0-2 2z"/><path d="M17 8a5 5 0 0 1 0 8"/></svg></div>
        <div class="lc-body">
          <span class="tag ${p.tag.toLowerCase()}">${p.tag}</span>
          <div class="lc-title">${p.title}</div>
          <div class="lc-text">${p.body}</div>
          <div class="lc-meta">
            <span>Posted ${ComSol.formatFullDate(p.date)}</span>
            <a href="#" class="del-post" data-id="${p.id}" style="color:var(--status-rejected);font-weight:600">Delete</a>
          </div>
        </div>
      </div>
    `,
              )
              .join("")
          : `<div class="empty"><p>You have not published any announcements yet.</p></div>`;
      }

      function bind() {
        document.getElementById("postForm").addEventListener("submit", (e) => {
          e.preventDefault();
          ComSol.addPost({
            tag: document.getElementById("tag").value,
            title: document.getElementById("title").value.trim(),
            body: document.getElementById("body").value.trim(),
          });
          e.target.reset();
          renderPosted();
          ComSol.toast("Announcement published to all residents.");
        });

        document.getElementById("posted").addEventListener("click", (e) => {
          const a = e.target.closest(".del-post");
          if (!a) return;
          e.preventDefault();
          if (!confirm("Delete this announcement?")) return;
          ComSol.deletePost(a.dataset.id);
          renderPosted();
        });
      }

      renderAdminShell({ active: "announcements", title: "Post Announcement" });
      renderPosted();
      bind();
    </script>
  </body>
</html>
