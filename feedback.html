<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Send feedback and suggestions to the barangay office and read replies." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
<title>Feedback — ComSol</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-root">
  <form id="fbForm" class="form-card">
    <h2>Submit Feedback</h2>
    <p class="subtitle">Share suggestions, file a complaint, or give a compliment to help improve our services.</p>

    <div class="form-group">
      <label class="form-label">Type</label>
      <select class="form-select form-input" id="type" required>
        <option value="Suggestion">Suggestion</option>
        <option value="Complaint">Complaint</option>
        <option value="Compliment">Compliment</option>
        <option value="Inquiry">Inquiry</option>
      </select>
    </div>

    <div class="form-group">
      <label class="form-label">Subject</label>
      <input class="form-input" id="subject" placeholder="Short summary" required maxlength="80" />
    </div>

    <div class="form-group">
      <label class="form-label">Message</label>
      <textarea class="form-textarea form-input" id="message" placeholder="Describe your feedback in detail…" required maxlength="600"></textarea>
    </div>

    <button class="btn" type="submit">Send Feedback</button>
  </form>

  <div class="section-block" style="margin-top:28px">
    <div class="section-block-head"><h3>My Previous Feedback</h3></div>
    <div class="list-stack" id="prev"></div>
  </div>
</div>

<div class="modal-scrim" id="okModal">
  <div class="modal">
    <div class="modal-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h3>Thank you!</h3>
    <p>Your feedback has been received and will be reviewed by the barangay office.</p>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('okModal').classList.remove('open')">Close</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
  ComSol.requireAuth();

  function renderPrev() {
    // Residents only ever see the feedback they themselves submitted.
    const list = ComSol.getMyFeedback();
    const prev = document.getElementById('prev');
    if (!prev) return;
    prev.innerHTML = list.length ? list.map(f => `
      <div class="list-card" id="feedback-${f.id}">
        <div class="lc-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="lc-body">
          <span class="tag">${f.type}</span>
          <div class="lc-title">${f.subject}</div>
          <div class="lc-text">${f.message}</div>
          ${f.reply ? `<div class="reply-box"><strong>Reply from the barangay office</strong><p>${f.reply}</p><span>${ComSol.formatFullDate(f.replyDate)}</span></div>` : ''}
          <div class="lc-meta"><span>Sent ${ComSol.formatFullDate(f.date)}</span></div>
        </div>
      </div>
    `).join('') : `<div class="empty"><p>You have not submitted any feedback yet.</p></div>`;
  }

  // renderShell() rebuilds #app-root, so every listener must be attached AFTER
  // it runs — otherwise the form falls back to a native submit and reloads.
  function wireForm() {
    document.getElementById('fbForm').addEventListener('submit', (e) => {
      e.preventDefault();
      ComSol.addFeedback({
        type: document.getElementById('type').value,
        subject: document.getElementById('subject').value.trim(),
        message: document.getElementById('message').value.trim(),
      });
      e.target.reset();
      document.getElementById('okModal').classList.add('open');
      renderPrev();
    });
  }

  renderShell({ active: 'feedback', title: 'Feedback' });
  wireForm();
  renderPrev();
  ComSol.highlightHash();
</script>

</body>
</html>
