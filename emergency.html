<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Emergency hotlines for fire, police, medical and disaster response." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
<title>Emergency Contacts — ComSol</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-root">
  <div class="section-block-head">
    <h3>Emergency Contacts</h3>
  </div>
  <p style="color:var(--text-muted);font-size:14px;margin:-4px 0 20px">Quick access to essential emergency hotlines. Tap <strong>Call now</strong> to dial immediately.</p>
  <div class="list-stack" id="list"></div>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
  ComSol.requireAuth();
  document.getElementById('list').innerHTML = EMERGENCY.map(e => `
    <div class="list-card">
      <div class="lc-ico" style="background:#FEE2E2;color:#B91C1C"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M6 20v-5a6 6 0 0 1 12 0v5M12 4v3M4.9 6.9l2 2M19.1 6.9l-2 2"/></svg></div>
      <div class="lc-body">
        <div class="lc-title">${e.name}</div>
        <div class="lc-text">${e.desc}</div>
        <div class="lc-meta"><span><strong>Hotline:</strong> ${e.phone}</span></div>
      </div>
      <div class="lc-actions">
        <a class="emg-call" href="tel:${e.phone.replace(/\s/g,'')}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.6a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.8.3 1.7.5 2.6.6A2 2 0 0 1 22 16.9z"/></svg>
          Call now
        </a>
      </div>
    </div>
  `).join('');
  renderShell({ active: 'emergency', title: 'Emergency Contacts' });
</script>
</body>
</html>
