<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Directory of barangay officials and how to contact them." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
<title>Contact Officials — ComSol</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app-root">
  <div class="section-block-head">
    <h3>Barangay Officials Directory</h3>
  </div>
  <p style="color:var(--text-muted);font-size:14px;margin:-4px 0 20px">Reach out to your elected officials and barangay staff for inquiries and concerns.</p>
  <div class="list-stack" id="list"></div>
</div>

<div class="modal-scrim" id="inqModal">
  <div class="modal">
    <h3 id="inqTitle" style="text-align:left;margin-bottom:16px">Send Inquiry</h3>
    <form id="inqForm">
      <div class="form-group"><label class="form-label">Subject</label><input class="form-input" id="i-sub" required maxlength="80" /></div>
      <div class="form-group"><label class="form-label">Message</label><textarea class="form-textarea form-input" id="i-msg" required maxlength="500"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="inqCancel">Cancel</button>
        <button type="submit" class="btn">Send</button>
      </div>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script src="js/nav.js"></script>
<script>
  ComSol.requireAuth();

  document.getElementById('list').innerHTML = OFFICIALS.map(o => `
    <div class="list-card">
      <div class="lc-ico" style="background:var(--accent);color:var(--primary);font-weight:700;font-size:16px">${ComSol.initials(o.name)}</div>
      <div class="lc-body">
        <div class="lc-title">${o.name}</div>
        <div class="lc-sub">${o.position}</div>
        <div class="lc-meta">
          <span><strong>Phone:</strong> <a href="tel:${o.phone.replace(/\s/g,'')}">${o.phone}</a></span>
          <span><strong>Email:</strong> <a href="mailto:${o.email}">${o.email}</a></span>
        </div>
      </div>
      <div class="lc-actions">
        <button class="btn" data-name="${o.name}">Send Inquiry</button>
      </div>
    </div>
  `).join('');

  const modal = document.getElementById('inqModal');
  document.getElementById('list').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-name]'); if (!b) return;
    document.getElementById('inqTitle').textContent = 'Send Inquiry to ' + b.dataset.name;
    document.getElementById('inqForm').reset();
    modal.classList.add('open');
  });
  document.getElementById('inqCancel').addEventListener('click', () => modal.classList.remove('open'));
  modal.addEventListener('click', (e) => { if (e.target.id === 'inqModal') modal.classList.remove('open'); });
  document.getElementById('inqForm').addEventListener('submit', (e) => {
    e.preventDefault();
    modal.classList.remove('open');
    ComSol.toast('Inquiry sent successfully');
  });

  renderShell({ active: 'officials', title: 'Contact Officials' });
</script>
</body>
</html>
