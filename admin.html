<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Administrator dashboard overview of resident reports." />
<meta name="robots" content="index,follow" />
<meta name="theme-color" content="#293681" />
    <title>Admin Dashboard — ComSol</title>
<link rel="icon" href="images/logo.png" type="image/png" />
<link rel="apple-touch-icon" href="images/logo.png" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="app-root">
      <div class="welcome-block">
        <h2 id="hello">Administrator Console</h2>
        <p>
          Overview of every issue reported by residents across the barangay.
        </p>
      </div>

      <div class="stats-grid" id="stats"></div>

      <div class="section-block">
        <div class="section-block-head">
          <h3>Reports Needing Action</h3>
          <a href="admin-reports.html">Manage all →</a>
        </div>
        <div id="queue"></div>
      </div>

      <div class="section-block">
        <div class="section-block-head"><h3>Reports by Category</h3></div>
        <div class="card" id="breakdown"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
    <script>
      ComSol.requireAdmin();

      const s = ComSol.reportStats();
      const cards = [
        { k: "total", cls: "", lbl: "Total Reports", val: s.total },
        { k: "pending", cls: "pending", lbl: "Pending", val: s.pending },
        { k: "review", cls: "review", lbl: "Under Review", val: s.review },
        { k: "progress", cls: "progress", lbl: "In Progress", val: s.progress },
        { k: "resolved", cls: "resolved", lbl: "Resolved", val: s.resolved },
        {
          k: "residents",
          cls: "review",
          lbl: "Registered Residents",
          val: ComSol.getUsers().length,
        },
      ];
      document.getElementById("stats").innerHTML = cards
        .map(
          (c) => `
    <div class="stat-card ${c.cls}">
      <div class="lbl">${c.lbl}</div>
      <div class="val">${c.val}</div>
    </div>
  `,
        )
        .join("");

      // Queue: anything not yet closed, oldest first so nothing is forgotten.
      const open = ComSol.getReports()
        .filter((r) => r.status !== "resolved" && r.status !== "rejected")
        .sort((a, b) => a.date - b.date);

      document.getElementById("queue").innerHTML = open.length
        ? `
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Reference</th><th>Report</th><th>Category</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${open
            .map(
              (r) => `
            <tr>
              <td><span class="ref-chip">${r.ref || "—"}</span></td>
              <td class="strong">${r.title}</td>
              <td>${r.category}</td>
              <td>${ComSol.formatDate(r.date)}</td>
              <td><span class="badge ${r.status}">${ComSol.statusLabel(r.status)}</span></td>
              <td><a class="details-link" href="admin-reports.html?ref=${encodeURIComponent(r.ref || "")}">Review →</a></td>
            </tr>
          `,
            )
            .join("")}
        </tbody>
      </table>
    </div>
  `
        : `<div class="empty"><p>Nothing pending — every report has been closed.</p></div>`;

      const bd = ComSol.categoryBreakdown();
      const max = Math.max(...bd.map((b) => b.count), 1);
      document.getElementById("breakdown").innerHTML = bd.length
        ? bd
            .map(
              (b) => `
    <div class="bar-row">
      <div class="bar-label">${b.name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(b.count / max) * 100}%"></div></div>
      <div class="bar-val">${b.count}</div>
    </div>
  `,
            )
            .join("")
        : '<p style="color:var(--text-muted);font-size:14px">No reports yet.</p>';

      renderAdminShell({ active: "dashboard", title: "Admin Dashboard" });
      document.getElementById("hello").textContent =
        `Welcome, ${(ComSol.getAdmin() || {}).name || "Administrator"}`;
    </script>
  </body>
</html>
